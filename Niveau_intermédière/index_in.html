<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="/src/output.css" rel="stylesheet" />
  </head>
  <body>
    <div class="bg-white flex flex-row gap-14">
      <div class="container">
        <h1 class="text-white text-2xl mb-5">Ajouter un élément à la liste:</h1>
        <input type="text" class="btn_add text" />
        <button
          class="btn_add cursor-pointer text-blue-500 bg-white text-2xl"
          id="btn"
        >
          Ajouter
        </button>
      </div>
      <div class="w-[45%] h-[35vh] mt-5 mr-12 flex flex-row gap-2">
        <h1 class="text-blue-500 text-3xl">Afficher une alerte:</h1>
        <button class="btn bg-purple-600 text-3xl text-white" id="alert">
          Affiche alert
        </button>
      </div>
      <div>
        <input
          type="text"
          class="elt mt-7"
          id="change"
          placeholder="Tapez ici...."
        />
        <h1 class="text-2xl text-blue-500 font-bold">
          Manipulation des classes
        </h1>
        <h1 class="text-3xl title" id="title">J'étais présente!</h1>
        <button class="btn bg-purple-600 text-3xl text-white" id="btn_f">
          Cliquez ici
        </button>
      </div>
    </div>

    <script src="/Niveau_intermédière/index_in.js"></script>
  </body>
</html>
